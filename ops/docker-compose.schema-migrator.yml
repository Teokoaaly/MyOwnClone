services:
  schema_migrator:
    image: node:22.16.0-bookworm-slim
    working_dir: /workspace
    # Attach to the same internal network where `db_postgres` is reachable.
    # Without this, the service lands on the default compose network and the
    # `db_postgres` alias cannot be resolved, which makes `drizzle-kit migrate`
    # fail with a silent RC=1 (the spinner hides the connection error).
    networks:
      - backend_internal
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    volumes:
      - ../MyOwnClone:/source:ro
      - schema_migrator_node_modules:/workspace/node_modules
    command:
      - /bin/sh
      - -ec
      - |
        case "$$DATABASE_URL" in
          postgresql+psycopg://*) DATABASE_URL="postgresql://$${DATABASE_URL#postgresql+psycopg://}" ;;
          postgres://*|postgresql://*) ;;
          *) exit 64 ;;
        esac
        export DATABASE_URL
        cp -a /source/. /workspace/
        node -e 'const value = process.env.DATABASE_URL; if (!value) process.exit(64); const parsed = new URL(value); if (!parsed.hostname || !["postgres:", "postgresql:"].includes(parsed.protocol)) process.exit(64)'
        npm ci --ignore-scripts --no-audit --no-fund
        npx drizzle-kit migrate --config drizzle.config.ts

networks:
  backend_internal:
    external: true
    name: ops_backend_internal

volumes:
  schema_migrator_node_modules:
