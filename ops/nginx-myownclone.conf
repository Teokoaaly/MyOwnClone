server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 212.227.169.99 myownclone.com www.myownclone.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 212.227.169.99 myownclone.com www.myownclone.com;

    ssl_certificate /etc/letsencrypt/live/myownclone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myownclone.com/privkey.pem;

    client_max_body_size 25m;

    # Admin dashboard API -> backend with service key auth
    location /api/admin/ {
        proxy_pass http://127.0.0.1:5001/console/api/myownclone/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key "Wxce/ZqRIQhIJOF/oJO0i5LKVMReXfgTOWFXBHH2vWKrCK34";
        proxy_set_header X-User-Id "00000000-0000-4000-8000-000000000101";
        proxy_set_header X-User-Role "owner";
        proxy_set_header X-User-Email "admin@myownclone.com";
        proxy_set_header Authorization $http_authorization;
    }

    location = /api/auth/login {
        proxy_pass http://127.0.0.1:5001/console/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/myownclone/ {
        proxy_pass http://127.0.0.1:5001/console/api/myownclone/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /console/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # T3.3: cache agresivo para assets estaticos de Next.js
    # _next/static: bundle JS/CSS hasheados (inmutables, cache 1 año)
    # _next/image: imagenes optimizadas (cache 1 dia)
    # favicon, robots.txt, sitemap: cache 1 hora
    location ~* ^/_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status "static-asset" always;
    }
    location ~* ^/_next/image/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
