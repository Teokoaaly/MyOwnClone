# MyOwnClone Nginx vhost — Producción
# Security headers + cache agresivo + proxy a Next.js + Flask backend

map $scheme $hsts_header {
    https   "max-age=31536000; includeSubDomains; preload";
    default "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 212.227.169.99 myownclone.com www.myownclone.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 212.227.169.99 myownclone.com www.myownclone.com;

    ssl_certificate /etc/letsencrypt/live/myownclone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myownclone.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    # Security headers
    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;

    # ---- Webhooks server-to-server (direct to backend) ----
    location = /api/myownclone/public/inbound-email {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/deploy {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Admin console API -> Flask backend ----
    location /console/api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # ---- Admin AI Models API -> Flask backend ----
    # SECURITY NOTE: X-API-Key and identity headers are hardcoded here for
    # service-to-service auth. The backend validates against DB (not headers).
    # Rotate SERVICE_API_KEY periodically in backend.env.production AND here.
    location /api/admin/ai-models {
        proxy_pass http://127.0.0.1:5001/console/api/myownclone/ai-models;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key "XimE6gtCeMepQ3WC8RwIBI7hgSJfAiozCdY95oEz1qBDm18h";
        proxy_set_header X-User-Id "00000000-0000-4000-8000-000000000101";
        proxy_set_header X-User-Role "owner";
        proxy_set_header X-User-Email "admin@myownclone.com";
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # ---- Admin Ingestion Status -> Flask backend ----
    # SECURITY NOTE: Same as above — hardcoded service auth for admin endpoints.
    location = /api/admin/ingestion-status {
        proxy_pass http://127.0.0.1:5001/console/api/myownclone/admin/ingestion-status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key "XimE6gtCeMepQ3WC8RwIBI7hgSJfAiozCdY95oEz1qBDm18h";
        proxy_set_header X-User-Id "00000000-0000-4000-8000-000000000101";
        proxy_set_header X-User-Role "platform_admin";
        proxy_set_header X-User-Email "admin@myownclone.com";
        proxy_read_timeout 60s;
    }

    # ---- Rate limit en login/registro ----
    location = /login {
        limit_req zone=login_zone burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /registro {
        limit_req zone=login_zone burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Resto del trafico al frontend Next.js ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache agresivo para assets estaticos
    location ~* ^/_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/_next/image/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
