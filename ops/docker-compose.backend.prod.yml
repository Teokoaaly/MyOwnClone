services:
  db_postgres:
    image: pgvector/pgvector:pg15@sha256:3073dc147f5b0ca05b36e10e04e73ca180b1e726e453c72a6fcc85f788afd0d1
    container_name: myownclone_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend_internal
    env_file:
      - ./backend.env.production
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: myownclone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myownclone"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: myownclone_redis
    restart: unless-stopped
    networks:
      - redis_network
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    env_file:
      - ./backend.env.production
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -p 6379 -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: myownclone_api
    restart: unless-stopped
    networks:
      - backend_internal
      - redis_network
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ./backend.env.production
    environment:
      FLASK_ENV: production
      DB_HOST: db_postgres
      DB_PORT: "5432"
      DB_NAME: myownclone
      DB_DATABASE: myownclone
      DB_USER: postgres
      DB_USERNAME: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379
      REDIS_TLS: "false"
      FLASK_APP: app_factory
      PYTHONPATH: /app
    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  api_worker:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: myownclone_worker
    restart: unless-stopped
    networks:
      - backend_internal
      - redis_network
    env_file:
      - ./backend.env.production
    environment:
      PYTHONPATH: /app
      HOME: /tmp
      TMPDIR: /tmp
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TLS: "false"
    command: ["python", "/app/api/worker_entrypoint.py", "ingestion"]
    depends_on:
      redis:
        condition: service_healthy
      db_postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.1"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; os.kill(1,0)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ollama:
    image: ollama/ollama:latest@sha256:c484b703176aa19dfc0a54cbfb60ab8094b38faa04283fb77eba1d33319e5eca
    container_name: myownclone_ollama
    restart: unless-stopped
    networks:
      - backend_internal
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/tags >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  backend_internal:
    driver: bridge
    internal: false
  redis_network:
    driver: bridge
