services:
  db_postgres:
    image: pgvector/pgvector:pg15
    container_name: myownclone_postgres
    restart: unless-stopped
    networks:
      - backend_internal
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: myownclone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myownclone"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myownclone_redis
    restart: unless-stopped
    networks:
      - redis_network
    command: >
      sh -c '
        exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --tls-port 6380 --tls-cert-file /etc/redis/tls/redis.crt --tls-key-file /etc/redis/tls/redis.key --tls-ca-cert-file /etc/redis/tls/ca.crt --port 0
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6380"
    volumes:
      - redis_data:/data
      - ./tls/redis:/etc/redis/tls:ro
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cert /etc/redis/tls/redis.crt --key /etc/redis/tls/redis.key --cacert /etc/redis/tls/ca.crt -h localhost -p 6380 -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # weaviate: ELIMINADO en T1.3 — el código Python no lo usa
  # (búsqueda exhaustiva confirma: 0 imports de weaviate-client en api/*.py)
  # pgvector (T1.4) es ahora la única fuente de búsqueda vectorial.

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: myownclone_api
    restart: unless-stopped
    networks:
      - backend_internal
      - redis_network
    volumes:
      - ./tls/redis:/etc/redis/tls:ro  # Necesario para TLS con Redis (T1.3 fix)
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ./backend.env.production
    environment:
      FLASK_ENV: production
      DB_HOST: db_postgres
      DB_PORT: 5432
      DB_NAME: myownclone
      DB_DATABASE: myownclone
      DB_USER: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6380
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: rediss://redis:6380
      REDIS_TLS: "true"
      # WEAVIATE_URL/API_KEY eliminadas en T1.3 — pgvector es la fuente de embeddings
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLASK_APP: app_factory
      PYTHONPATH: /app
      # Build DATABASE_URL from discrete vars (required by assert_production_secrets)
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  # weaviate_data eliminado en T1.3

networks:
  backend_internal:
    driver: bridge
    internal: false  # Allow external access only on exposed ports
  redis_network:
    driver: bridge
