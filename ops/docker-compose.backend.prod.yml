services:
  db_postgres:
    image: pgvector/pgvector:pg15@sha256:3073dc147f5b0ca05b36e10e04e73ca180b1e726e453c72a6fcc85f788afd0d1
    container_name: myownclone_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend_internal
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: myownclone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myownclone"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: myownclone_redis
    restart: unless-stopped
    networks:
      - redis_network
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost -p 6379 -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.0@sha256:58b576d36eace6a33f1a0866b9fd13fd58abfb9ce1eaaa419758c70b6a427e36
    container_name: myownclone_weaviate
    restart: unless-stopped
    networks:
      - backend_internal
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "${WEAVIATE_API_KEY}"
      AUTHENTICATION_APIKEY_USERS: "admin"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_MODULES: text2vec-openai,text2vec-huggingface
    volumes:
      - weaviate_data:/var/lib/weaviate
    # NOTE: the weaviate image ships wget but NOT curl. Use wget for the healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: myownclone_api
    restart: unless-stopped
    networks:
      - backend_internal
      - redis_network
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ./backend.env.production
    environment:
      FLASK_ENV: production
      DB_HOST: db_postgres
      DB_PORT: 5432
      DB_NAME: myownclone
      DB_DATABASE: myownclone
      DB_USER: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://redis:6379
      REDIS_TLS: "false"
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLASK_APP: app_factory
      PYTHONPATH: /app
      # Build DATABASE_URL from discrete vars (required by assert_production_secrets)
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest@sha256:c484b703176aa19dfc0a54cbfb60ab8094b38faa04283fb77eba1d33319e5eca
    container_name: myownclone_ollama
    restart: unless-stopped
    networks:
      - backend_internal
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/tags >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  ollama_data:

networks:
  backend_internal:
    driver: bridge
    internal: false  # Allow external access only on exposed ports
  redis_network:
    driver: bridge
