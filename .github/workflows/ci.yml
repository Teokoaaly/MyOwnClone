name: CI
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  contract-tests:
    name: Contract tests (root tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install pytest
      - name: Run root tests
        env:
          FLASK_ENV: testing
          JWT_SECRET_KEY: ci-test-key-must-be-at-least-32-chars-long
          DB_PASSWORD: ci-test-db-password
          REDIS_PASSWORD: ci-test-redis-password
        run: pytest -q --tb=short

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - working-directory: api
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - working-directory: api
        run: ruff check . --select=E,F,W --exit-zero
      - working-directory: api
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
          REDIS_PASSWORD: ci-test-redis-password
          JWT_SECRET_KEY: ci-test-key-must-be-at-least-32-chars-long
          IMPERSONATION_TOKEN_PEPPER: ci-test-pepper-must-be-long-enough
        run: |
          flask db upgrade
          pytest --tb=short

  frontend:
    runs-on: ubuntu-latest
    needs: [contract-tests, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: MyOwnClone/package-lock.json }
      - working-directory: MyOwnClone
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npx vitest run --coverage --reporter=verbose 2>&1 | tail -20

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: MyOwnClone/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Playwright browsers
        working-directory: MyOwnClone
        run: npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: api
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
          REDIS_PASSWORD: ci-test-redis-password
          JWT_SECRET_KEY: ci-test-key-must-be-at-least-32-chars-long
          IMPERSONATION_TOKEN_PEPPER: ci-test-pepper-must-be-long-enough
          SERVICE_API_KEY: ci-test-service-key
        run: |
          pip install -r requirements.txt
          flask db upgrade
          flask run --port 5001 &
      - name: Run E2E tests
        working-directory: MyOwnClone
        env:
          CI: true
        run: npx playwright test
