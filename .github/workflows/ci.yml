name: CI
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - working-directory: api
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - working-directory: api
        run: ruff check . --exit-zero
      - working-directory: api
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          JWT_SECRET_KEY: ci-test-key-must-be-at-least-32-chars-long
          IMPERSONATION_TOKEN_PEPPER: ci-test-pepper-must-be-long-enough
        run: |
          flask db upgrade
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: MyOwnClone/package-lock.json }
      - working-directory: MyOwnClone
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npx vitest run
